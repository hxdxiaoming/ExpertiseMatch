experiment_name: SciNCL Profile-level Mean Aggregation (k=10)
encoder_class: SentenceTransformerEncoder
encoder_config:
  model_name: models/sentence-transformers/scincl
  device: null
  batch_size: 16
  max_length: 512
strategy_class: ProfileAggregationStrategy
strategy_config:
  k: 10
  aggregation: mean
  similarity: cosine
description: 'SciNCL Profile-level平均聚合实验（k=10）：

  - 策略①：先聚合，后比较

  - 选择审稿人的前25篇论文

  - 将这些论文的embeddings进行平均聚合

  - 计算聚合后的审稿人表示与查询论文的余弦相似度

  - 计算效率高，适合大规模应用

  '
