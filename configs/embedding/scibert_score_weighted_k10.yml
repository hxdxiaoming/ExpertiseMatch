experiment_name: SciBERT Score-level Weighted_Mean Aggregation (k=10)
encoder_class: SciBERTEncoder
encoder_config:
  model_name: models/scibert
  device: null
  batch_size: 16
  max_length: 512
strategy_class: ScoreAggregationStrategy
strategy_config:
  k: 10
  aggregation: weighted_mean
  similarity: cosine
description: 'SciBERT Score-level加权平均聚合实验（k=10）：

  - 策略②：先比较，后聚合

  - 计算查询论文与审稿人每篇论文的余弦相似度

  - 选择前25个最高相似度分数

  - 对这些分数进行位置加权平均（排名越高权重越大）

  - 精度最高的匹配策略

  '
