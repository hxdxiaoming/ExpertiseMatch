# BM25 + Embedding (SciNCL, 10 papers) Configuration
# 使用SciNCL embedding智能选择10篇最相关论文

experiment_name: "BM25 + SciNCL Embedding (10)"

# 匹配器配置
matcher_class: "BM25Matcher"
matcher_config:
  # === BM25核心参数 ===
  bm25_k1: 1.2                    # 标准词频饱和参数
  bm25_b: 0.75                    # 标准文档长度归一化
  
  # === 审稿人画像参数 ===
  max_papers_per_reviewer: 10     # 限制最多10篇论文
  paper_selection_method: "embedding_based" # 基于embedding选择
  embedding_model_name: "models/sentence-transformers/scincl" # SciNCL模型
  
  # === 缓存参数 ===
  use_precomputed: false          # 不使用预计算缓存
  cache_dir: "cache"              # 缓存目录

# 实验描述
description: |
  Embedding增强的BM25实验配置：
  - 使用SciNCL模型计算论文相似度
  - 为每个审稿人选择与查询论文最相关的10篇论文
  - 提供更丰富的审稿人画像信息
  - 平衡画像质量和计算复杂度
  - 需要预计算embedding以提高效率
